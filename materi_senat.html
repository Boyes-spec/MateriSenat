                                        <div className="glass-card p-6 rounded-2xl space-y-3">
                                            <h3 className="text-base font-bold text-blue-400 flex items-center gap-2 border-b border-slate-800 pb-2">
                                                <i className="fa-solid fa-hand-fist"></i> Aturan Ketukan Palu Sidang
                                            </h3>
                                            <div className="space-y-2">
                                                {GUIDEBOOK_DATA.aturanKetukPalu.map((k, i) => (
                                                    <div key={i} className="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-0.5">
                                                        <span className="font-bold text-amber-400 text-xs">{k.ketuk}</span>
                                                        <p className="text-[11px] text-slate-300">{k.arti}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="glass-card p-6 rounded-2xl space-y-3">
                                            <h3 className="text-base font-bold text-emerald-400 flex items-center gap-2 border-b border-slate-800 pb-2">
                                                <i className="fa-solid fa-scroll"></i> 3 Jenis Putusan Dalam Sidang
                                            </h3>
                                            <div className="grid grid-cols-3 gap-2 text-center">
                                                {GUIDEBOOK_DATA.jenisPutusan.map((p, i) => (
                                                    <div key={i} className="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                                                        <span className="text-[10px] font-bold text-amber-400 block uppercase">{p.tipe}</span>
                                                        <span className="text-[9px] text-blue-400 block">{p.sifat}</span>
                                                        <p className="text-[10px] text-slate-300 mt-1">{p.ket}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'ketua' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="glass-card p-8 rounded-3xl border border-slate-800 max-w-4xl mx-auto">
                                    <div className="grid md:grid-cols-12 gap-8 items-center">
                                        <div className="md:col-span-5 text-center space-y-3">
                                            <div className="w-48 h-48 mx-auto rounded-3xl bg-slate-900 border-2 border-amber-500/50 p-2 shadow-2xl relative">
                                                <div className="w-full h-full rounded-2xl bg-gradient-to-tr from-blue-900 to-indigo-900 flex flex-col items-center justify-center text-5xl text-amber-400">
                                                    <i className="fa-solid fa-user-tie"></i>
                                                </div>
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-extrabold text-white">{KABINET_INFO.ketua}</h3>
                                                <span className="inline-block bg-amber-500/20 text-amber-400 font-bold text-xs px-3 py-1 rounded-full border border-amber-500/30 mt-1">
                                                    {KABINET_INFO.angkatan}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="md:col-span-7 space-y-4">
                                            <div>
                                                <span className="text-xs text-blue-400 font-bold uppercase tracking-wider block">Formatur / Ketua Senat</span>
                                                <h2 className="text-2xl font-bold text-white mt-1">Senat HIMATEKK ITS 2025/2026</h2>
                                            </div>

                                            <p className="text-xs text-slate-300 leading-relaxed bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                                                Memimpin Kabinet Resonansi dengan semangat menjadikan Senat sebagai ruang gema aspirasi yang responsif, kolaboratif, dan berdampak bagi seluruh warga Teknik Kimia FTIRS ITS.
                                            </p>

                                            <div className="space-y-2">
                                                <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider">
                                                    <i className="fa-solid fa-briefcase mr-2"></i> Rekam Jejak Pengalaman & Kepemimpinan:
                                                </h4>
                                                <div className="grid sm:grid-cols-2 gap-2 text-xs">
                                                    {KABINET_INFO.pengalamanKetua.map((exp, idx) => (
                                                        <div key={idx} className="p-2.5 rounded-lg bg-slate-900 border border-slate-800 flex items-center gap-2 text-slate-300">
                                                            <i className="fa-solid fa-circle-check text-emerald-400 text-xs"></i>
                                                            <span>{exp}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'quiz' && (
                            <div className="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                                <div className="glass-card p-6 lg:p-8 rounded-3xl border border-slate-800 flex items-center justify-between">
                                    <div className="space-y-1">
                                        <span className="text-xs font-bold text-amber-400 uppercase tracking-widest bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                                            <i className="fa-solid fa-circle-question mr-1.5"></i> Evaluasi Pemahaman
                                        </span>
                                        <h2 className="text-2xl font-extrabold text-white">Kuis Pemahaman Senat HIMATEKK ITS</h2>
                                        <p className="text-xs text-slate-300">Uji pengetahuan Anda mengenai fungsi Senat, peraturan, dan sejarah legislatif.</p>
                                    </div>
                                    {quizSubmitted && (
                                        <div className="text-right bg-slate-900 px-5 py-3 rounded-2xl border border-amber-500/30">
                                            <span className="text-xs text-slate-400 block">Skor Akhir:</span>
                                            <span className="text-2xl font-extrabold text-amber-400">{quizScore} / 100</span>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-6">
                                    {QUIZ_QUESTIONS.map((q, qIdx) => (
                                        <div key={q.id} className="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                                            <h3 className="font-bold text-white text-sm flex items-start gap-3">
                                                <span className="bg-blue-600 text-white w-6 h-6 rounded-lg flex items-center justify-center shrink-0 text-xs">
                                                    {qIdx + 1}
                                                </span>
                                                <span>{q.question}</span>
                                            </h3>

                                            <div className="space-y-2">
                                                {q.options.map((opt, optIdx) => {
                                                    const isSelected = quizAnswers[q.id] === optIdx;
                                                    const isCorrect = q.answer === optIdx;
                                                    
                                                    let btnStyle = "bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700";
                                                    if (isSelected) {
                                                        btnStyle = "bg-blue-900/50 border-blue-500 text-white font-semibold";
                                                    }
                                                    if (quizSubmitted) {
                                                        if (isCorrect) {
                                                            btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-semibold";
                                                        } else if (isSelected && !isCorrect) {
                                                            btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200";
                                                        }
                                                    }

                                                    return (
                                                        <button
                                                            key={optIdx}
                                                            onClick={() => handleQuizSelect(q.id, optIdx)}
                                                            className={`w-full text-left p-3.5 rounded-xl border text-xs transition-all flex items-center justify-between ${btnStyle}`}>
                                                            <span>{opt}</span>
                                                            {quizSubmitted && isCorrect && <i className="fa-solid fa-circle-check text-emerald-400"></i>}
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {quizSubmitted && (
                                                <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-[11px] text-slate-300">
                                                    <span className="font-bold text-amber-400 block mb-0.5"><i className="fa-solid fa-lightbulb mr-1"></i> Penjelasan:</span>
                                                    {q.explanation}
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    <div className="flex justify-end gap-4 pt-4">
                                        {!quizSubmitted ? (
                                            <button
                                                onClick={handleQuizSubmit}
                                                disabled={Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length}
                                                className={`px-6 py-3 rounded-xl font-bold text-xs transition-all ${
                                                    Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length
                                                    ? 'bg-slate-800 text-slate-500 cursor-not-allowed'
                                                    : 'bg-amber-500 hover:bg-amber-600 text-slate-950 shadow-lg shadow-amber-500/20'
                                                }`}>
                                                Kirim & Lihat Hasil Skor
                                            </button>
                                        ) : (
                                            <button
                                                onClick={handleQuizReset}
                                                className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs px-6 py-3 rounded-xl border border-slate-700 transition-all">
                                                Coba Kuis Lagi
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-500">
                        <p>© 2025/2026 Senat HIMATEKK ITS — Kabinet Resonansi. Media Pembelajaran Peraturan & Program Kerja.</p>
                    </footer>

                    {}
                    {presenterMode && (
                        <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-between p-6 lg:p-12 animate-fadeIn">
                            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                <div className="flex items-center gap-3">
                                    <span className="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full font-bold border border-amber-500/30">
                                        {slides[currentSlide].badge}
                                    </span>
                                    <span className="text-xs text-slate-400">Slide {currentSlide + 1} dari {slides.length}</span>
                                </div>
                                <button 
                                    onClick={() => setPresenterMode(false)}
                                    className="text-slate-400 hover:text-white bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-xs flex items-center gap-2">
                                    <i className="fa-solid fa-xmark"></i> Keluar Presenter Mode
                                </button>
                            </div>

                            <div className="max-w-4xl mx-auto w-full my-auto glass-card p-8 lg:p-12 rounded-3xl border border-blue-500/30 shadow-2xl">
                                <div className="mb-6 border-b border-slate-800 pb-4">
                                    <h2 className="text-3xl font-extrabold text-white mb-1">{slides[currentSlide].title}</h2>
                                    <p className="text-sm text-amber-400 font-medium">{slides[currentSlide].subtitle}</p>
                                </div>

                                {slides[currentSlide].content}
                            </div>

                            <div className="flex items-center justify-between border-t border-slate-800 pt-4 max-w-4xl mx-auto w-full">
                                <button
                                    onClick={() => setCurrentSlide(Math.max(0, currentSlide - 1))}
                                    disabled={currentSlide === 0}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 transition-all ${
                                        currentSlide === 0 
                                        ? 'bg-slate-900 text-slate-600 cursor-not-allowed' 
                                        : 'bg-slate-800 hover:bg-slate-700 text-white'
                                    }`}>
                                    <i className="fa-solid fa-chevron-left"></i> Previous
                                </button>

                                <div className="flex gap-2">
                                    {slides.map((_, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setCurrentSlide(idx)}
                                            className={`w-3 h-3 rounded-full transition-all ${
                                                currentSlide === idx ? 'bg-amber-400 w-8' : 'bg-slate-800'
                                            }`}
                                        />
                                    ))}
                                </div>

                                <button
                                    onClick={() => setCurrentSlide(Math.min(slides.length - 1, currentSlide + 1))}
                                    disabled={currentSlide === slides.length - 1}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 transition-all ${
                                        currentSlide === slides.length - 1 
                                        ? 'bg-slate-900 text-slate-600 cursor-not-allowed' 
                                        : 'bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-600/30'
                                    }`}>
                                    Next <i className="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
